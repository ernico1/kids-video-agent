# Configuration de l'agent de g\u00e9n\u00e9ration vid\u00e9o
# Remplacez les valeurs <VOTRE_XXX> par vos cl\u00e9s API

openai:
  api_key: "${OPENAI_API_KEY}"  # Utiliser les variables d'environnement
  model: "gpt-4o-mini"
  temperature: 0.7

elevenlabs:
  api_key: "${ELEVENLABS_API_KEY}"
  voice_id: "EXAVITQu4vr4xnSDxMaL"  # Voix par d\u00e9faut (Bella)

replicate:
  api_key: "${REPLICATE_API_KEY}"
  model: "black-forest-labs/flux-schnell"

video:
  resolution: "1920x1080"
  fps: 30
  duration_per_image: 5
  output_format: "mp4"

language:
  default: "fr"
  supported: ["fr", "en", "es", "ar", "wo"]
